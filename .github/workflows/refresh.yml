name: Refresh profile cards

on:
  schedule:
    - cron: "0 4 * * *"
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [profile-refresh]

# Serialise runs so two triggers cannot race on the same commit.
concurrency:
  group: refresh-profile
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Render cards
        env:
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
        run: npm run render

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add out cache
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "chore: refresh profile cards"
            git push
          fi
