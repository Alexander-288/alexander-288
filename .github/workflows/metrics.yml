name: Metrics

on:
  schedule:
    - cron: "0 4 * * *"
  push:
    branches: [main]
  workflow_dispatch:

# Two runs committing metrics.svg at once make the second one fail.
concurrency:
  group: metrics
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      # Patched fork: working habits + hardcoded tracks. Runs a prebuilt image
      # from ghcr.io/alexander-288/metrics:profile, so no rebuild per run.
      - uses: Alexander-288/metrics@profile
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: alexander-288
          filename: metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Europe/Warsaw
          # Single 480px column; "columns" gets clipped in the README.
          config_display: regular
          config_octicon: yes
          config_animations: no
          # Top to bottom: standard data, time of day, tracks, languages, topics
          config_order: base.header, base.activity+community, base.repositories, lines, habits, music, languages, topics

          # Lines added / removed (shown inside the repositories block)
          plugin_lines: yes
          plugin_lines_sections: base

          # Commit activity per hour of day only
          plugin_habits: yes
          plugin_habits_from: 1000
          plugin_habits_days: 30
          plugin_habits_facts: no
          plugin_habits_charts: yes
          plugin_habits_charts_sections: hours

          # Hardcoded suggested tracks, one "Title - Artist" per line
          plugin_music: yes
          plugin_music_mode: manual
          plugin_music_limit: 10
          plugin_music_tracks: |
            No Surprises - Radiohead
            Reminiscence - Florian Christl
            505 - Arctic Monkeys

          # Most used languages
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_threshold: 1%

          # Mastered technologies: topics you star on github.com/topics
          plugin_topics: yes
          plugin_topics_mode: mastered
          plugin_topics_sort: stars
          plugin_topics_limit: 20
