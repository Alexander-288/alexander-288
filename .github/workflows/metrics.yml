name: Metrics

on:
  schedule:
    - cron: "0 4 * * *"
  push:
    branches: [main]
  workflow_dispatch:

# Two runs committing metrics.svg at once make the second fail its
# post-commit verification, so only one may be in flight.
concurrency:
  group: metrics
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      # ── Panel 1: identity, activity, community, lines, habits ────────
      # base + lines gives the header block, the 7-day contribution
      # squares, "contributed to N repositories", sponsors/stars/forks/
      # watchers, releases, disk usage, and lines added/removed.
      # habits adds the commits-by-hour, commits-by-day and language
      # activity charts.
      - name: Main dashboard
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: alexander-288
          filename: metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Europe/Warsaw
          config_display: columns
          config_octicon: yes
          config_animations: no

          # Lines added / removed across your repositories.
          plugin_lines: yes
          plugin_lines_sections: base

          # Coding habits is DISABLED: it is broken upstream, not
          # misconfigured. GitHub removed `commits` from the PushEvent
          # payload of the events API, so the plugin crashes with
          # "Cannot destructure property 'author' of 'undefined'".
          # Verified against other accounts — it fails for everyone.
          plugin_habits: no

          # Mastered technologies. These come from the topics you star at
          # github.com/topics — star one and it appears here as an icon.
          plugin_topics: yes
          plugin_topics_mode: mastered
          plugin_topics_sort: stars
          plugin_topics_limit: 20

          # Contributions calendar, plus current streak and average
          # commits per day.
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # Most used languages.
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_threshold: 1%

          # Suggested tracks. Playlist mode needs no secrets — the
          # provider is inferred from the public playlist URL. Swap the
          # URL below for your own playlist.
          # The provider is NOT inferred from the URL — it must be set.
          plugin_music: yes
          plugin_music_provider: spotify
          plugin_music_mode: playlist
          plugin_music_playlist: https://open.spotify.com/embed/playlist/37i9dQZF1DX5trt9i14X7j
          plugin_music_limit: 3
