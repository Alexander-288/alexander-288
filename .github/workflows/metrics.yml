name: Metrics

on:
  schedule:
    - cron: "0 4 * * *"
  push:
    branches: [main]
  workflow_dispatch:

# Two runs committing metrics.svg at once make the second one fail.
concurrency:
  group: metrics
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      # Must be the upstream action: only lowlighter/* pulls the prebuilt image.
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: alexander-288
          filename: metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Europe/Warsaw
          # Single 480px column; "columns" gets clipped in the README.
          config_display: regular
          config_octicon: yes
          config_animations: no

          # Lines added / removed
          plugin_lines: yes
          plugin_lines_sections: base

          # Contributions calendar, streak, average per day
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # Most used languages
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_threshold: 1%

          # Mastered technologies: topics you star on github.com/topics
          plugin_topics: yes
          plugin_topics_mode: mastered
          plugin_topics_sort: stars
          plugin_topics_limit: 20

          # Off: broken upstream (GitHub dropped commits from PushEvent payloads)
          plugin_habits: no
          # Off: Spotify changed its embed page, playlist scraping fails
          plugin_music: no
