name: Metrics

on:
  schedule:
    - cron: "0 4 * * *"
  push:
    branches: [main]
  workflow_dispatch:

# Two runs committing metrics.svg at once make the second fail its
# post-commit verification, so only one may be in flight.
concurrency:
  group: metrics
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      # ── Panel 1: identity, activity, community, lines, habits ────────
      # base + lines gives the header block, the 7-day contribution
      # squares, "contributed to N repositories", sponsors/stars/forks/
      # watchers, releases, disk usage, and lines added/removed.
      # habits adds the commits-by-hour, commits-by-day and language
      # activity charts.
      # Uses a patched fork, not lowlighter/metrics@latest. GitHub removed
      # `commits` from PushEvent payloads, which crashes the habits plugin
      # upstream for everyone; the fork resolves commits from the pushed
      # before...head range instead. Switch back to lowlighter/metrics@latest
      # once that fix is merged upstream.
      # Note: a fork builds the docker image from source, so runs are slower.
      - name: Main dashboard
        uses: Alexander-288/metrics@fix-habits-pushevent-commits
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: alexander-288
          filename: metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Europe/Warsaw
          config_display: columns
          config_octicon: yes
          config_animations: no

          # Lines added / removed across your repositories.
          plugin_lines: yes
          plugin_lines_sections: base

          # Coding habits: hour-of-day, day-of-week, language activity.
          # Works only on the patched fork referenced above.
          plugin_habits: yes
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_charts_type: classic
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_trim: yes
          plugin_habits_languages_limit: 3

          # Mastered technologies. These come from the topics you star at
          # github.com/topics — star one and it appears here as an icon.
          plugin_topics: yes
          plugin_topics_mode: mastered
          plugin_topics_sort: stars
          plugin_topics_limit: 20

          # Contributions calendar, plus current streak and average
          # commits per day.
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # Most used languages.
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_threshold: 1%

          # Suggested tracks. Playlist mode needs no secrets — the
          # provider is inferred from the public playlist URL. Swap the
          # URL below for your own playlist.
          # Suggested tracks is DISABLED. Playlist mode scrapes the Spotify
          # embed page with a headless browser, and Spotify changed that
          # page's markup, so it now fails with
          # "Failed to execute 'getComputedStyle' ... not of type 'Element'".
          # Scraping could never do hand-picked tracks anyway.
          plugin_music: no
